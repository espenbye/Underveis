name: Underveis

options:
  bundleIdPrefix: no.espenbye
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Xcode-recommended project settings (kept here so `make generate` preserves them).
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    DEVELOPMENT_TEAM: 9QD8BJRLPC # "Espen Bye" (personal team)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    # macOS 26's actool caps the generated AppIcon.icns at 128pt@2x (256px) and keeps the full icon
    # only in Assets.car. App Store validation (ITMS-90236) wants a 512pt@2x (1024px) image in the
    # ICNS, so force actool to emit every standalone-icon size.
    ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all
    # The app only uses standard HTTPS/WSS (TLS to Entur), which is exempt encryption — so it doesn't
    # use non-exempt encryption. Baking this in suppresses App Store Connect's per-build prompt.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    # iPad must support all four orientations (it isn't full-screen-only); iPhone keeps the usual three.
    # NB: the build-setting names use the `_iPad`/`_iPhone` suffix — the `~ipad`/`~iphone` tilde form
    # is not a valid build-setting name and Xcode silently drops it, leaving the plist with no
    # orientations (App Store reject ITMS-90474). These emit the `UISupportedInterfaceOrientations~ipad`
    # / `~iphone` plist keys.
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Underveis viser kollektivtrafikk i nærheten av deg på kartet."
    # Entitlements only apply when building for macOS (App Sandbox + outbound network + location).
    "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Underveis.entitlements

targets:
  Underveis:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "26.0"
      macOS: "26.0"
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.espenbye.underveis
        PRODUCT_NAME: Underveis
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.navigation"
        INFOPLIST_KEY_CFBundleDisplayName: Underveis
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  Underveis:
    build:
      targets:
        Underveis: all
    run:
      config: Debug
      # MapKit's Look Around renderer trips a Metal API Validation assertion
      # (MTLStoreActionMultisampleResolve … requires resolve texture) when its surface is laid out at
      # zero size during a sheet/cover transition. It's a validation-layer assert in framework code —
      # harmless in Release — but it kills debug runs. This app ships no custom Metal, so turning the
      # validation off costs us nothing.
      enableGPUValidationMode: disabled
    profile:
      config: Release
    archive:
      config: Release
