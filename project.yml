name: Underveis

options:
  bundleIdPrefix: no.espenbye
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 9QD8BJRLPC # "Espen Bye" (personal team)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Underveis viser kollektivtrafikk i nærheten av deg på kartet."
    # Entitlements only apply when building for macOS (App Sandbox + outbound network + location).
    "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Underveis.entitlements

targets:
  Underveis:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "26.0"
      macOS: "26.0"
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.espenbye.underveis
        PRODUCT_NAME: Underveis
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.navigation"
        INFOPLIST_KEY_CFBundleDisplayName: Underveis
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  Underveis:
    build:
      targets:
        Underveis: all
    run:
      config: Debug
      # MapKit's Look Around renderer trips a Metal API Validation assertion
      # (MTLStoreActionMultisampleResolve … requires resolve texture) when its surface is laid out at
      # zero size during a sheet/cover transition. It's a validation-layer assert in framework code —
      # harmless in Release — but it kills debug runs. This app ships no custom Metal, so turning the
      # validation off costs us nothing.
      enableGPUValidationMode: disabled
    profile:
      config: Release
    archive:
      config: Release
