name: Bussradar

options:
  bundleIdPrefix: no.espenbye
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "" # Select the "Espen Bye" team once in Xcode → Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Bussradar viser kollektivtrafikk i nærheten av deg på kartet."
    # Entitlements only apply when building for macOS (App Sandbox + outbound network + location).
    "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Bussradar.entitlements

targets:
  Bussradar:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "26.0"
      macOS: "26.0"
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.espenbye.bussradar
        PRODUCT_NAME: Bussradar
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.navigation"
        INFOPLIST_KEY_CFBundleDisplayName: Bussradar
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  Bussradar:
    build:
      targets:
        Bussradar: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
